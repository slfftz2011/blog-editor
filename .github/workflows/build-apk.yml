name: Build Android APK

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
      - 'android-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release.jks

      - name: Inject Signing Config & Patch Version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. 使用 sed 注入签名配置
          sed -i '/android {/a\
              signingConfigs {\
                  release {\
                      storeFile file("my-release.jks")\
                      storePassword System.getenv("KEYSTORE_PASSWORD")\
                      keyAlias System.getenv("KEY_ALIAS")\
                      keyPassword System.getenv("KEY_PASSWORD")\
                  }\
              }' android/app/build.gradle
          
          # 2. 让 debug 构建使用这个正式签名
          sed -i '/buildTypes {/a\
              debug {\
                  signingConfig signingConfigs.release\
              }' android/app/build.gradle
          
          # 3. 注入版本号
          node scripts/patch-android-signing.mjs

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..

      - name: Rename APK
        id: rename_apk
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == v* ]] || [[ "$TAG_NAME" == android-v* ]]; then
            VERSION=$(echo "$TAG_NAME" | sed -E 's/^(android-)?v//')
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          
          APP_NAME="BlogEditor-${VERSION}.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "${APP_NAME}"
          echo "APK_FILE=${APP_NAME}" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blogeditor-apk
          path: ${{ env.APK_FILE }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}